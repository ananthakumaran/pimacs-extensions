          the project.\n\nGuidelines:\n- `read`: view files with `read`, not
          `bash` (`sed`/`grep`/`cat`) — only `read` rows carry usable
          anchors.\n- `read`: call before `replace` when you need fresh
          anchors.\n- `read`: call again after an edit when you need anchors you
          lack — post-edit diff `+anchor│`/` anchor│` rows and any served
