          `remove_to`).\n- `replace`: post-edit diff `+anchor│`/` anchor│` rows
          are fresh anchors for the next edit — no new `read` needed. Same-file
          calls in one message form one batch with a single combined diff; check
          each batch diff before the next turn's edits on that file.\n-
          `replace`: batched calls must target disjoint ranges and all be valid;
          an overlap or any failure aborts the whole batch with nothing
